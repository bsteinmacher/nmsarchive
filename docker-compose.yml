services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      DATABASE_URL: file:../data/nmsarchive.db
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
